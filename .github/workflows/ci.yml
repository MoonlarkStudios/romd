name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  console-guardrails:
    name: Console source guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Check console theme token-import ratchet
        run: clients/romd_console/tool/check_token_imports.sh

      - name: Check console theme token governance
        run: clients/romd_console/tool/check_theme_token_registry.sh

  backend:
    name: Backend deterministic tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview

      - name: Restore backend dependencies
        run: dotnet restore

      - name: Build backend
        run: dotnet build --no-restore --configuration Release

      - name: Test domain
        run: >-
          dotnet test tests/Romd.Domain.Tests/Romd.Domain.Tests.csproj
          --no-build --configuration Release --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage/deterministic/domain

      - name: Test DAT parsing
        run: >-
          dotnet test tests/Romd.Dat.Parsing.Tests/Romd.Dat.Parsing.Tests.csproj
          --no-build --configuration Release --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage/deterministic/dat-parsing

      - name: Test application
        run: >-
          dotnet test tests/Romd.Application.Tests/Romd.Application.Tests.csproj
          --no-build --configuration Release --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage/deterministic/application

      - name: Test storage
        run: >-
          dotnet test tests/Romd.Storage.Tests/Romd.Storage.Tests.csproj
          --no-build --configuration Release --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage/deterministic/storage

      - name: Test infrastructure
        run: >-
          dotnet test
          tests/Romd.Infrastructure.Tests/Romd.Infrastructure.Tests.csproj
          --no-build --configuration Release --verbosity normal
          --blame-hang --blame-hang-timeout 120s --blame-hang-dump-type none
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage/deterministic/infrastructure

      - name: Upload deterministic backend coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-deterministic-coverage
          path: coverage/deterministic/
          if-no-files-found: ignore
          retention-days: 5

  integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview

      - name: Restore integration dependencies
        run: >-
          dotnet restore
          tests/Romd.Hosting.IntegrationTests/Romd.Hosting.IntegrationTests.csproj

      - name: Build integration test surface
        run: >-
          dotnet build
          tests/Romd.Hosting.IntegrationTests/Romd.Hosting.IntegrationTests.csproj
          --no-restore --configuration Release

      - name: Test integration with hang diagnostics
        run: >-
          dotnet test
          tests/Romd.Hosting.IntegrationTests/Romd.Hosting.IntegrationTests.csproj
          --no-build --configuration Release --verbosity normal
          --blame-hang --blame-hang-timeout 60s --blame-hang-dump-type none
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage/integration

      - name: Upload integration coverage and hang diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-integration-results
          path: coverage/integration/
          if-no-files-found: ignore
          retention-days: 5

  api-drift:
    name: OpenAPI schema and client drift gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Regenerate OpenAPI schemas and clients
        id: regenerate-openapi
        working-directory: web
        run: pnpm api:update

      - name: Check for schema and client drift
        run: |
          DRIFT_PATHS=(
            web/schemas/admin-v1.json
            web/schemas/consumer-v1.json
            web/packages/romd-admin-api-client/src/generated
            web/packages/romd-consumer-api-client/src/generated
          )

          UNTRACKED=$(git status --porcelain -- "${DRIFT_PATHS[@]}")
          if [ -n "$UNTRACKED" ]; then
            echo "Stale generated artifacts (untracked files detected):"
            echo "$UNTRACKED"
            echo ""
            echo "Remediation: run 'pnpm api:update' from web/, review the diff,"
            echo "and commit the regenerated schemas and clients in the same change."
            exit 1
          fi

          if ! git diff --exit-code -- "${DRIFT_PATHS[@]}"; then
            git diff --stat -- "${DRIFT_PATHS[@]}"
            echo ""
            echo "Stale generated artifacts: run 'pnpm api:update' from web/,"
            echo "review the diff, and commit the regenerated schemas and clients"
            echo "in the same change."
            exit 1
          fi

      - name: Build production hosts with frontend
        env:
          CI: "true"
        run: dotnet build -c Release -m:1 -p:BuildFrontend=true

      - name: Upload regenerated artifacts for drift diagnosis
        if: ${{ failure() && steps.regenerate-openapi.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-openapi-clients
          path: |
            web/schemas/admin-v1.json
            web/schemas/consumer-v1.json
            web/packages/romd-admin-api-client/src/generated
            web/packages/romd-consumer-api-client/src/generated
          if-no-files-found: error
          retention-days: 7

  web:
    name: Web lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web
        run: pnpm lint

      - name: Test web
        run: pnpm test

      - name: Build web
        run: pnpm build

  production-compose:
    name: Production Compose and recovery drill
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Validate merged production topology
        run: python3 scripts/deployment/test_contract.py
      - name: Build images and exercise production deployment
        run: python3 scripts/deployment/smoke.py --build
