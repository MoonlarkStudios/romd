name: Release deployment bundle

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
      - name: Build and verify the images to publish
        run: python3 scripts/deployment/smoke.py --build
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish matching images and record immutable references
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          namespace="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          for service in admin consumer worker player; do
            image="$namespace/romd-$service:$RELEASE_TAG"
            docker tag "romd-$service:test" "$image"
            docker push "$image"
            digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
            printf 'ROMD_%s_IMAGE=%s\n' "${service^^}" "$digest" >> images.env
          done
          postgres="$(docker image inspect postgres:18-bookworm --format '{{index .RepoDigests 0}}')"
          printf 'ROMD_POSTGRES_IMAGE=%s\n' "$postgres" >> images.env
      - name: Package deployment assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-output
          scripts/deployment/bundle.sh images.env "release-output/romd-$RELEASE_TAG-deployment.tar.gz"
      - name: Create release with deployment bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}" release-output/*
