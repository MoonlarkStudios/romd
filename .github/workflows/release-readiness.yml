name: Release readiness rehearsal

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Full source commit (empty uses the selected workflow ref)'
        type: string
        required: false
      version:
        description: 'Intended v<SemVer> version (empty uses a disposable version)'
        type: string
        required: false
  schedule:
    - cron: '17 6 * * *'
  pull_request:
    paths:
      - '.github/workflows/release-readiness.yml'
      - 'scripts/release/readiness.py'
      - 'scripts/release/test_readiness.py'

permissions:
  contents: read

concurrency:
  group: readiness-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  rehearse:
    name: Build, scan and rehearse without publication
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      SOURCE_REVISION: ${{ inputs.revision || github.sha }}
      INTENDED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.0'
      - name: Install the locked rehearsal browser
        run: |
          npm ci --ignore-scripts --prefix scripts/release/browser
          scripts/release/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Build and run the common rehearsal gates
        run: >-
          python3 scripts/release/readiness.py --revision "$SOURCE_REVISION"
          --tag "$INTENDED_VERSION" --output "$RUNNER_TEMP/release-readiness"
      - name: Show readiness and the remaining public gates
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/release-readiness/summary.md" ]; then
            cat "$RUNNER_TEMP/release-readiness/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Rehearsal did not produce a report; inspect the failed preparation step. Public qualification is pending.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain sanitized readiness evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-readiness/
          if-no-files-found: error
          retention-days: 7
