     inkscape:window-maximized="1"
     inkscape:current-layer="ottercade-mark" /><title
     id="oc-title">Ottercade — Romp the otter with a game controller</title><desc
     id="oc-desc">Romp, a friendly two-tone otter, peeks over a rounded retro game controller.</desc><defs
     id="defs1"><!-- OTTERCADE PALETTE
     ink #183B3F · fur #B96849 · fur light #F2C9A5
     controller #397A82 · controller light #5F9DA1 · gold #F3B944
     button light #C6C5E3 · button dark #7769B4 · soft white #FFF9EE
     Shadow = ink at 16%. Never flat grey — grey only reads as shadow on white.
     Face buttons follow the North American SNES: X (top) and A (right) dark,
     B (bottom) and Y (left) light. --><style
       id="style1">
.ink-fill{fill:#183b3f}
.fur-fill{fill:#b96849}
.fur-light-fill{fill:#f2c9a5}
.controller-fill{fill:#397a82}
.controller-light-fill{fill:#5f9da1}
.gold-fill{fill:#f3b944}
.button-light-fill{fill:#c6c5e3}
.button-dark-fill{fill:#7769b4}
.soft-white-fill{fill:#fff9ee}
.brand-outline{stroke:#183b3f;stroke-width:26;stroke-linecap:round;stroke-linejoin:round}
.button-outline{stroke:#183b3f;stroke-width:18;stroke-linejoin:round}
.detail-line{fill:none;stroke:#183b3f;stroke-width:18;stroke-linecap:round;stroke-linejoin:round}
.fine-line{fill:none;stroke:#183b3f;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
/* Paws are drawn inside a 0.9 group; these render as 26 and 13. */
.paw-outline{stroke:#183b3f;stroke-width:28.89;stroke-linecap:round;stroke-linejoin:round}
.paw-line{fill:none;stroke:#183b3f;stroke-width:14.44;stroke-linecap:round;stroke-linejoin:round}
