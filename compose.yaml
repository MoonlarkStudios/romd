# Portable production stack. Set ROMD_HOST in .env; everything else has a default.
# The public origins default to https://ROMD_HOST:<port>. ROMD_HOST is deliberately not marked
# required here: older Compose releases evaluate a nested required variable even when the
# outer one is set, which would break installations that set the origins explicitly.
name: romd

x-service: &service
  restart: unless-stopped
  stop_grace_period: 90s
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-api-health: &api-health
  test: ["CMD", "curl", "--fail", "--silent", "--max-time", "7", "http://localhost:8080/health/ready"]
  interval: 15s
  timeout: 10s
  retries: 6
  start_period: 60s

x-forwarded: &forwarded
  Romd__ForwardedHeaders__Enabled: "true"
  Romd__ForwardedHeaders__KnownProxies__0: ${ROMD_TRUSTED_PROXY:-172.28.0.2}
  Romd__ForwardedHeaders__ForwardLimit: "1"


x-romd-common-environment: &romd-common-environment
  DOTNET_ENVIRONMENT: Production
  ASPNETCORE_ENVIRONMENT: Production
  # URLs below are authoritative; clear the runtime image's competing port default.
  ASPNETCORE_HTTP_PORTS: ""
  Romd__DataDirectory: /var/lib/romd
  Romd__ReadinessMarkerPath: /run/romd/ready
  Romd__Auth__AdminSpa__RedirectUris__0: ${ROMD_ADMIN_PUBLIC_URL:-https://${ROMD_HOST:-}:${ROMD_ADMIN_PORT:-7664}}/auth/callback
  Romd__Auth__AdminSpa__PostLogoutRedirectUris__0: ${ROMD_ADMIN_PUBLIC_URL:-https://${ROMD_HOST:-}:${ROMD_ADMIN_PORT:-7664}}
  Romd__Auth__ConsumerSpa__RedirectUris__0: ${ROMD_CONSUMER_PUBLIC_URL:-https://${ROMD_HOST:-}:${ROMD_CONSUMER_PORT:-7663}}/auth/callback
  Romd__Auth__ConsumerSpa__PostLogoutRedirectUris__0: ${ROMD_CONSUMER_PUBLIC_URL:-https://${ROMD_HOST:-}:${ROMD_CONSUMER_PORT:-7663}}
  # Signing secrets generated by romd-init, inside the data volume so backups carry them.
  ROMD_SECRETS_DIRECTORY: /var/lib/romd/secrets
  Romd__ConsumerDelivery__SigningKeyId: ${ROMD_CONSUMER_DELIVERY_SIGNING_KEY_ID:-primary}
  Romd__ConsumerDelivery__SignedUrlTtlMinutes: ${ROMD_CONSUMER_DELIVERY_SIGNED_URL_TTL_MINUTES:-10}

# Path import (Romd__AllowedImportPaths__*): if you bind-mount import source
# directories, mount each one at an IDENTICAL container path on romd-admin and
# romd-worker. The admin host stages imports and the worker host deletes
# move-mode originals; a root mounted at different paths leaves sources behind.
services:
  # Runs to completion before anything else on every start. It generates the database
  # passwords and signing secrets once and never replaces them; each service then mounts
  # only its own password volume.
  romd-init:
    image: ${ROMD_WORKER_IMAGE:?set ROMD_WORKER_IMAGE from the release bundle}
    # Also issues an HTTPS certificate for these names unless one is supplied in ROMD_TLS_DIRECTORY.
    command: --init-deployment /init ${ROMD_CERTIFICATE_NAMES:-${ROMD_HOST:-}}
    network_mode: none
    restart: "no"
    logging: *logging
    volumes:
      - romd-secrets-postgres:/init/postgres
      - romd-secrets-worker:/init/worker
      - romd-secrets-admin:/init/admin
      - romd-secrets-consumer:/init/consumer
      - romd-data:/init/data
      - romd-ca:/init/ca
      - ${ROMD_TLS_DIRECTORY:-romd-tls}:/init/tls

  postgres:
    image: ${ROMD_POSTGRES_IMAGE:?set ROMD_POSTGRES_IMAGE from the release bundle}
    networks: [backend]
    <<: *service
    depends_on:
      romd-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: romd_bootstrap
      POSTGRES_PASSWORD_FILE: /run/romd-postgres/bootstrap
      POSTGRES_DB: romd
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      ROMD_POSTGRES_SECRETS_DIRECTORY: /run/romd-postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - romd-postgres:/var/lib/postgresql
      - romd-secrets-postgres:/run/romd-postgres:ro
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U romd_bootstrap -d romd"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  romd-worker:
    # The worker holds admission leases as namespace PID 1. Its death extinguishes
    # media descendants, allowing custody recovery after container recreation.
    init: false
    networks: [backend]
    tmpfs: ["/run/romd:mode=1777"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/romd/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    image: ${ROMD_WORKER_IMAGE:?set ROMD_WORKER_IMAGE from the release bundle}
    <<: *service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *romd-common-environment
      Providers__Igdb__ClientId: ${IGDB_CLIENT_ID:-}
      Providers__Igdb__ClientSecret: ${IGDB_CLIENT_SECRET:-}
      # Only used while creating the first administrator; removable after bootstrap.
      Romd__DefaultAdminEmail: ${ROMD_DEFAULT_ADMIN_EMAIL:-admin@localhost}
      Romd__DefaultAdminPassword: ${ROMD_DEFAULT_ADMIN_PASSWORD:-}
      ConnectionStrings__Romd: "Host=postgres;Port=5432;Database=romd;Username=romd_worker;Passfile=/etc/romd/database/pgpass"
      ConnectionStrings__RomdProvisioning: "Host=postgres;Port=5432;Database=romd;Username=romd_provisioner;Passfile=/etc/romd/database/pgpass"
      ConnectionStrings__Hangfire: "Host=postgres;Port=5432;Database=romd;Username=romd_worker;Passfile=/etc/romd/database/pgpass"
      ConnectionStrings__HangfireProvisioning: "Host=postgres;Port=5432;Database=romd;Username=romd_provisioner;Passfile=/etc/romd/database/pgpass"
    volumes:
      - romd-data:/var/lib/romd
      - romd-secrets-worker:/etc/romd/database:ro

  romd-admin:
    # Stable addresses prevent cached DNS from routing to another surface after restart.
    networks:
      backend: {}
      edge:
        ipv4_address: ${ROMD_ADMIN_EDGE_IP:-172.28.0.3}
    tmpfs: ["/run/romd:mode=1777"]
    healthcheck: *api-health
    image: ${ROMD_ADMIN_IMAGE:?set ROMD_ADMIN_IMAGE from the release bundle}
    <<: *service
    depends_on:
      romd-worker:
        condition: service_healthy
    environment:
      <<: [*romd-common-environment, *forwarded]
      ASPNETCORE_URLS: http://+:8080
      # Buffer multipart uploads on the data volume, outside the container layer and backups.
      ASPNETCORE_TEMP: /var/lib/romd/temp/requests
      Romd__AdminHost__PublicUrl: ${ROMD_ADMIN_PUBLIC_URL:-https://${ROMD_HOST:-}:${ROMD_ADMIN_PORT:-7664}}
      Romd__AdminHost__CorsOrigins__0: ${ROMD_ADMIN_PUBLIC_URL:-https://${ROMD_HOST:-}:${ROMD_ADMIN_PORT:-7664}}
      Providers__Igdb__ClientId: ${IGDB_CLIENT_ID:-}
      Providers__Igdb__ClientSecret: ${IGDB_CLIENT_SECRET:-}
      ConnectionStrings__Romd: "Host=postgres;Port=5432;Database=romd;Username=romd_admin;Passfile=/etc/romd/database/pgpass"
      ConnectionStrings__Hangfire: "Host=postgres;Port=5432;Database=romd;Username=romd_admin;Passfile=/etc/romd/database/pgpass"
    volumes:
      - romd-data:/var/lib/romd
      - romd-secrets-admin:/etc/romd/database:ro

  romd-consumer:
    networks:
      backend: {}
      edge:
        ipv4_address: ${ROMD_CONSUMER_EDGE_IP:-172.28.0.4}
    tmpfs: ["/run/romd:mode=1777"]
    healthcheck: *api-health
    image: ${ROMD_CONSUMER_IMAGE:?set ROMD_CONSUMER_IMAGE from the release bundle}
    <<: *service
    depends_on:
      romd-worker:
        condition: service_healthy
    environment:
      <<: [*romd-common-environment, *forwarded]
      ASPNETCORE_URLS: http://+:8080
      Romd__ConsumerHost__PublicUrl: ${ROMD_CONSUMER_PUBLIC_URL:-https://${ROMD_HOST:-}:${ROMD_CONSUMER_PORT:-7663}}
      Romd__Vfs__Enabled: ${ROMD_VFS_ENABLED:-false}
      Romd__Vfs__MaximumConcurrentRequests: ${ROMD_VFS_MAX_REQUESTS:-8}
      Romd__Vfs__MaximumConcurrentRequestsPerUser: ${ROMD_VFS_MAX_REQUESTS_PER_USER:-4}
      Romd__Vfs__MaximumDirectoryEntries: ${ROMD_VFS_MAX_DIRECTORY_ENTRIES:-20000}
      Romd__ConsumerHost__CorsOrigins__0: ${ROMD_CONSUMER_PUBLIC_URL:-https://${ROMD_HOST:-}:${ROMD_CONSUMER_PORT:-7663}}
      ConnectionStrings__Romd: "Host=postgres;Port=5432;Database=romd;Username=romd_consumer;Passfile=/etc/romd/database/pgpass"
      ConnectionStrings__Hangfire: "Host=postgres;Port=5432;Database=romd;Username=romd_consumer;Passfile=/etc/romd/database/pgpass"
      Romd__BrowserPlayback__PlayerOrigins__0__Parent: ${ROMD_CONSUMER_PUBLIC_URL:-https://${ROMD_HOST:-}:${ROMD_CONSUMER_PORT:-7663}}
      Romd__BrowserPlayback__PlayerOrigins__0__Player: ${ROMD_PLAYER_PUBLIC_URL:-https://${ROMD_HOST:-}:${ROMD_PLAYER_PORT:-7665}}
    volumes:
      - romd-data:/var/lib/romd
      - romd-secrets-consumer:/etc/romd/database:ro

  romd-player:
    networks:
      edge:
        ipv4_address: ${ROMD_PLAYER_EDGE_IP:-172.28.0.5}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/player-config.json"]
      interval: 15s
      timeout: 5s
      retries: 6
    image: ${ROMD_PLAYER_IMAGE:?set ROMD_PLAYER_IMAGE from the release bundle}
    <<: *service
    environment:
      ROMD_PLAYER_EMULATORJS_SOURCE: ${ROMD_PLAYER_EMULATORJS_SOURCE:-cdn}
      ROMD_PLAYER_EMULATORJS_DATA_PATH: ${ROMD_PLAYER_EMULATORJS_DATA_PATH:-}
      ROMD_PLAYER_CORES: ${ROMD_PLAYER_CORES:-}
      ROMD_PLAYER_ALLOWED_PARENTS: ${ROMD_CONSUMER_PUBLIC_URL:-https://${ROMD_HOST:-}:${ROMD_CONSUMER_PORT:-7663}}

  # HTTPS for all three surfaces on one host name, a port each. The applications trust
  # forwarded headers from this address only.
  ingress:
    # The release-qualified nginx pin (scripts/deployment/base-images.json); override only deliberately.
    image: ${ROMD_NGINX_IMAGE:-nginx:1.30.6-alpine-slim@sha256:e2355aa95529a7999dad94ddcb45a8768abf6fb0b204c93b1a3ffce477d7b893}
    <<: *service
    depends_on:
      romd-init:
        condition: service_completed_successfully
    networks:
      edge:
        ipv4_address: ${ROMD_TRUSTED_PROXY:-172.28.0.2}
    environment:
      ROMD_HOST: ${ROMD_HOST:-}
      ROMD_CONSUMER_PORT: ${ROMD_CONSUMER_PORT:-7663}
      ROMD_ADMIN_PORT: ${ROMD_ADMIN_PORT:-7664}
      ROMD_PLAYER_PORT: ${ROMD_PLAYER_PORT:-7665}
      NGINX_ENVSUBST_FILTER: "^ROMD_"
    volumes:
      - ./deploy/ingress/templates:/etc/nginx/templates:ro
      # Reloads nginx when the certificate files change, so a renewal is served without a restart.
      - ./deploy/ingress/entrypoint/40-romd-reload-certificate.sh:/docker-entrypoint.d/40-romd-reload-certificate.sh:ro
      - ${ROMD_TLS_DIRECTORY:-romd-tls}:/etc/romd/tls:ro
    ports:
      - "${ROMD_BIND:-0.0.0.0}:${ROMD_CONSUMER_PORT:-7663}:7663"
      - "${ROMD_BIND:-0.0.0.0}:${ROMD_ADMIN_PORT:-7664}:7664"
      - "${ROMD_BIND:-0.0.0.0}:${ROMD_PLAYER_PORT:-7665}:7665"

volumes:
  romd-data:
  romd-postgres:
  romd-secrets-postgres:
  romd-secrets-worker:
  romd-secrets-admin:
  romd-secrets-consumer:
  romd-ca:
  romd-tls:

# Only the ingress publishes host ports. backend allows outbound access for the
# worker's metadata/catalog providers.
networks:
  backend:
  edge:
    ipam:
      config:
        - subnet: ${ROMD_EDGE_SUBNET:-172.28.0.0/24}
          # Reserve low addresses for static peers, avoiding an IP allocation race.
          ip_range: ${ROMD_EDGE_DYNAMIC_RANGE:-172.28.0.128/25}
