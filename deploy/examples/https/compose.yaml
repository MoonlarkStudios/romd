# Three host names on one HTTPS port with your own certificate, in place of the
# built-in one-name, three-port ingress. Add to the root compose.yaml and set each
# ROMD_*_PUBLIC_URL to its https:// origin. All relative paths resolve from the bundle root.
services:
  ingress:
    labels:
      io.romd.ingress-example: "true"
    environment:
      ROMD_ADMIN_HOST: ${ROMD_ADMIN_HOST:?set ROMD_ADMIN_HOST}
      ROMD_CONSUMER_HOST: ${ROMD_CONSUMER_HOST:?set ROMD_CONSUMER_HOST}
      ROMD_PLAYER_HOST: ${ROMD_PLAYER_HOST:?set ROMD_PLAYER_HOST}
    volumes:
      - ./deploy/examples/https/templates:/etc/nginx/templates:ro
      - ${ROMD_TLS_DIRECTORY:?set ROMD_TLS_DIRECTORY}:/etc/romd/tls:ro
    ports: !override
      - "${ROMD_HTTPS_BIND:-127.0.0.1}:${ROMD_HTTPS_PORT:-443}:443"
