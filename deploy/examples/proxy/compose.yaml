# Your own reverse proxy in place of the built-in ingress. Add to the root
# compose.yaml and set each ROMD_*_PUBLIC_URL to its https:// origin. Attach the
# proxy container to this project's ingress-admin, ingress-consumer and
# ingress-player networks and attach nothing else to them: each application
# accepts forwarded headers from every peer on its ingress network. The runbook
# covers a proxy that cannot join those networks.
services:
  ingress: !reset null
