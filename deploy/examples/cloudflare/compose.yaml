# Cloudflare Tunnel in place of published ports. Add to the root compose.yaml and set
# each ROMD_*_PUBLIC_URL to its https:// origin. The connector and the ingress share a
# network of their own, and the ingress listens for the tunnel only there, so no other
# container can reach that listener. Nothing is published on the host.
services:
  ingress:
    labels:
      io.romd.ingress-example: "true"
    environment:
      ROMD_ADMIN_HOST: ${ROMD_ADMIN_HOST:?set ROMD_ADMIN_HOST}
      ROMD_CONSUMER_HOST: ${ROMD_CONSUMER_HOST:?set ROMD_CONSUMER_HOST}
      ROMD_PLAYER_HOST: ${ROMD_PLAYER_HOST:?set ROMD_PLAYER_HOST}
      ROMD_TUNNEL_ALIAS: ingress.tunnel
    volumes:
      - ./deploy/examples/cloudflare/templates:/etc/nginx/templates:ro
      - ./deploy/examples/cloudflare/entrypoint/10-romd-tunnel-address.envsh:/docker-entrypoint.d/10-romd-tunnel-address.envsh:ro
    ports: !reset []
    networks:
      tunnel:
        aliases: [ingress.tunnel]

  cloudflared:
    # Reviewed connector pin, adopted at least 14 days after its upstream release.
    image: ${ROMD_CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      tunnel: {}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  tunnel:
